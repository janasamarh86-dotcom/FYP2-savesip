{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body text-center p-5">
          <i class="bi bi-{{ 'signpost-split' if code == 404 else 'tools' }} text-success" style="font-size: 3.5rem;"></i>
          <div class="display-4 fw-bold text-success mt-2">{{ code }}</div>
          <h1 class="h4 fw-bold">{{ title }}</h1>
          <p class="text-muted mb-4">{{ message }}</p>
          {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard') }}" class="btn btn-success">
              <i class="bi bi-speedometer2 me-1"></i>Back to Dashboard
            </a>
          {% else %}
            <a href="{{ url_for('index') }}" class="btn btn-success">
              <i class="bi bi-house me-1"></i>Back to Home
            </a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
